# 山寺 santemple.jessylab.cc → 127.0.0.1:4318（Node：静态文件、/ws 联机、/promo/ 宣传片）
# 首次部署后执行 certbot --nginx -d santemple.jessylab.cc 加 HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name santemple.jessylab.cc;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml model/gltf-binary;
    client_max_body_size 1m;

    location /ws {
        proxy_pass http://127.0.0.1:4318;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:4318;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
